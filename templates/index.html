<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLC Flux</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <meta name="mlcflux-version" content="{{ mlcflux_release_label }}">
</head>
<body>
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>MLC Flux</h2>

      <button
        id="sidebarCollapseBtn"
        class="sidebar-collapse-btn"
        type="button"
        aria-controls="sidebarContent"
        aria-expanded="true"
        title="Replier le volet latéral"
      >
        ‹
      </button>
    </div>

    <div id="sidebarContent" class="sidebar-content">
      <button id="themeToggleBtn" class="secondary-btn theme-toggle-btn" type="button">
        🌙 Mode sombre
      </button>

      <div class="filters period-filter-block">
        <h3>Période d’analyse</h3>

        <button
          id="periodActiveSummary"
          class="period-active-summary"
          type="button"
          aria-controls="customPeriodFields"
          aria-expanded="false"
          title="Définir une période personnalisée"
        >
          <span class="period-active-label">Période active</span>
          <span id="periodFilterHint" class="period-active-value">Chargement…</span>
        </button>

        <div class="sidebar-field-label">Période rapide</div>
        <select id="periodPreset" class="sidebar-select">
          <option value="all">Toute la période disponible</option>
          <option value="last30">30 derniers jours</option>
          <option value="last90">90 derniers jours</option>
          <option value="currentYear">Année en cours</option>
          <option value="year2025">2025</option>
          <option value="year2024">2024</option>
          <option value="year2023">2023</option>
          <option value="custom">Personnalisée</option>
        </select>

        <div id="customPeriodFields" class="period-date-grid hidden">
          <div>
            <input
              id="periodStart"
              class="sidebar-date-input"
              type="date"
              aria-label="Date de début"
            />
          </div>

          <div>
            <input
              id="periodEnd"
              class="sidebar-date-input"
              type="date"
              aria-label="Date de fin"
            />
          </div>
        </div>

        <p class="period-autorefresh-note">
          Les données se mettent à jour automatiquement après chaque changement.
        </p>
      </div>

      <div class="filters sidebar-views-block">
        <h3>Vues</h3>
        <label><input type="radio" name="dataView" value="stats" checked> Statistiques globales</label>
        <label><input type="radio" name="dataView" value="monetary-pilotage"> Pilotage monétaire</label>
        <label><input type="radio" name="dataView" value="pros"> Professionnels &amp; particuliers</label>
        <label><input type="radio" name="dataView" value="info"> Info & méthodologie</label>
        <label><input type="radio" name="dataView" value="admin"> Administration &amp; paramètres</label>
      </div>
    </div>
  </div>

  <div id="mainContent" class="main-content">
    <div id="pageTitle"></div>
    <div id="content"></div>
  </div>

  <script src="/static/vendor/cytoscape.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.3.0/dist.min.js"></script>
  <script src="{{ url_for('static', filename='vendor/marked.umd.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
  <script src="/static/js/chart.js"></script>
  <script src="/static/js/professional_consumption_map.js"></script>
  <script src="/static/js/app.js"></script>



<script>
/* MULTI_HOME_LINK002_BRAND_CLICK_SCRIPT */
(function initializeMlcFluxBrandHomeLink() {
  function normalizeText(value) {
    return String(value || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function findMlcFluxBrandElement() {
    const candidates = Array.from(document.querySelectorAll(`
      h1,
      h2,
      .app-title,
      .sidebar-title,
      .sidebar-brand,
      .brand,
      .logo,
      [class*="brand"],
      [class*="logo"],
      [class*="title"]
    `));

    return candidates.find(element => {
      const text = normalizeText(element.textContent || "");
      return text === "mlc flux" || text === "mlcflux";
    }) || null;
  }

  function makeMlcFluxBrandClickable() {
    const element = findMlcFluxBrandElement();
    if (!element || element.dataset.multiHomeLink002Bound === "true") {
      return;
    }

    element.dataset.multiHomeLink002Bound = "true";
    element.classList.add("app-brand-home-link");
    element.setAttribute("role", "link");
    element.setAttribute("tabindex", "0");
    element.setAttribute("title", "Revenir à la page principale");
    element.setAttribute("aria-label", "Revenir à la page principale");

    const goHome = event => {
      event.preventDefault();
      window.location.href = "/";
    };

    element.addEventListener("click", goHome);

    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        goHome(event);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", makeMlcFluxBrandClickable);
  } else {
    makeMlcFluxBrandClickable();
  }

  window.addEventListener("load", makeMlcFluxBrandClickable);

  if (typeof MutationObserver !== "undefined") {
    const observer = new MutationObserver(makeMlcFluxBrandClickable);

    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    } else {
      document.addEventListener("DOMContentLoaded", () => {
        observer.observe(document.body, { childList: true, subtree: true });
      });
    }
  }
})();
</script>

  <div id="mlcfluxVersionBadge" class="mlcflux-version-badge" data-mlcflux-version="{{ mlcflux_app_version }}" aria-label="{{ mlcflux_release_label }}">{{ mlcflux_release_label }}</div>
</body>
</html>

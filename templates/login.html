<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MLCFlux — connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #fbf6ee;
      --panel: #ffffff;
      --ink: #221f1c;
      --muted: #6f625b;
      --border: rgba(154, 119, 92, 0.24);
      --accent: #e85b2a;
      --accent-dark: #bd3f20;
      --danger: #9b2f21;
      --shadow: rgba(91, 57, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(232, 91, 42, 0.12), transparent 28rem),
        radial-gradient(circle at 80% 85%, rgba(47, 127, 159, 0.10), transparent 26rem),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(440px, 100%);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--border);
      border-radius: 1.4rem;
      box-shadow: 0 22px 60px var(--shadow);
      padding: 2rem;
    }

    .eyebrow {
      color: var(--accent-dark);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.76rem;
      margin-bottom: 0.7rem;
    }

    h1 {
      margin: 0 0 0.7rem;
      font-size: 2.1rem;
      letter-spacing: -0.04em;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 1.4rem;
    }

    label {
      display: block;
      font-weight: 750;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.8rem 0.9rem;
      font: inherit;
      margin-bottom: 1rem;
      background: #fff;
    }

    input:focus {
      border-color: rgba(232, 91, 42, 0.72);
      outline: none;
      box-shadow: 0 0 0 3px rgba(232, 91, 42, 0.12);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      font: inherit;
      font-weight: 850;
      padding: 0.9rem 1rem;
      cursor: pointer;
    }

    .error {
      border: 1px solid rgba(155, 47, 33, 0.25);
      background: rgba(155, 47, 33, 0.08);
      color: var(--danger);
      border-radius: 0.85rem;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">MLCFlux</div>
    <h1>Connexion</h1>
    <p>Accès réservé aux personnes autorisées sur cette instance MLCFlux.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
